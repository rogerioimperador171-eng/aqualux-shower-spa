[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.12"

# O site chama /api/pix/*; na Netlify isso é atendido pelas Functions.
[[redirects]]
  from = "/api/pix/create"
  to = "/.netlify/functions/pix-create"
  status = 200
  force = true

[[redirects]]
  from = "/api/pix/check"
  to = "/.netlify/functions/pix-check"
  status = 200
  force = true
